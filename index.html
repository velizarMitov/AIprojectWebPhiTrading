<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phi Trading | AI Predictions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/css2">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">PHI<span class="accent">.TRADING</span></div>
            <ul class="nav-links">
                <li><a href="#forex">Forex</a></li>
                <li><a href="#crypto">Crypto</a></li>
                <li><a href="#stocks">Stocks</a></li>
                <li><a href="#ml-predictions">ML Predictions</a></li>
            </ul>
            <div class="nav-buttons">
                <a href="#login" id="show-login" class="btn btn-secondary">Login</a>
                <a href="#register" id="show-register" class="btn btn-primary">Register</a>
                <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1 class="hero-headline">DECODE THE MARKETS <br> WITH <span class="highlight">AI PRECISION</span></h1>
            <p class="hero-subtext">Algorithmic trading signals powered by next-gen machine learning. Stop guessing. Start executing.</p>
            <div class="hero-cta">
                <a href="#start-trading" class="btn btn-large btn-neon">GET PREDICTIONS</a>
            </div>
        </div>
        <div class="hero-background-grid"></div>
    </header>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="modal-close">&times;</button>
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="register">Register</button>
            </div>
            <div id="auth-message" class="auth-message"></div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required minlength="6" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
        </div>
    </div>

    <script>
        // Simple hamburger menu toggle
        const hamburger = document.querySelector(".hamburger");
        const navLinks = document.querySelector(".nav-links");
        const navButtons = document.querySelector(".nav-buttons");

        hamburger.addEventListener("click", () => {
            navLinks.classList.toggle("active");
            navButtons.classList.toggle("active");
            hamburger.classList.toggle("toggle");
        });
    </script>
    <script type="module" src="auth.js"></script>
</body>
</html>
