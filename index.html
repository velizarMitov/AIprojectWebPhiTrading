<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://*.supabase.co https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://esm.sh https://*.supabase.co wss://*.supabase.co https://www.alphavantage.co; img-src 'self' data: https:;">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%2300ff88'>Φ</text></svg>">
    <title>Phi Trading | AI Predictions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/css2">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Ticker stays at very top, full width -->
    <div class="ticker-wrap">
        <div class="ticker" id="forex-ticker">
            <span class="ticker-item">Loading Market Data...</span>
        </div>
    </div>

    <!-- Sidebar Navigation (Left Side) -->
    <nav class="navbar">
        <div class="logo">PHI<span class="accent">.TRADING</span></div>
        
        <div class="nav-menu">
            <a href="#home" class="nav-item active" data-view="home">
                <span>◆</span> Home
            </a>
            <a href="#predictions" class="nav-item" data-view="predictions">
                <span>▸</span> Predictions
            </a>
            <a href="#admin" class="nav-item" id="admin-nav-btn" style="display: none;" data-view="admin">
                <span>◉</span> Admin Panel
            </a>
        </div>

        <div class="nav-categories">
            <div class="category-label">FILTER BY:</div>
            <a href="#" class="category-item" data-category="Forex">Forex</a>
            <a href="#" class="category-item" data-category="Crypto">Crypto</a>
            <a href="#" class="category-item" data-category="Stocks">Stocks</a>
            <a href="#" class="category-item" data-category="ML Predictions">ML Predictions</a>
        </div>

        <div class="nav-buttons">
            <a href="#login" id="show-login" class="btn btn-secondary">Login</a>
            <a href="#register" id="show-register" class="btn btn-primary">Register</a>
            <a href="#admin" id="admin-panel-btn" class="btn btn-secondary" style="display: none;">Admin</a>
            <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
        </div>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- Mobile Menu Backdrop -->
    <div class="mobile-backdrop"></div>

    <!-- Main Content Area (Right of Sidebar) -->
    <main id="main-content">
        <header class="hero">
        <div id="hero-news-container" class="hero-news-container">
            <div class="hero-news-overlay"></div>
            <div class="hero-news-content">
                <span class="breaking-badge">BREAKING</span>
                <h1 class="hero-news-headline">Loading Market Intelligence...</h1>
            </div>
            <div class="hero-cta">
                <a href="#predictions" id="hero-cta-btn" class="btn btn-large btn-neon">GET PREDICTIONS</a>
            </div>
        </div>
    </header>

    <!-- Admin Panel Section -->
    <section id="admin-section" class="admin-section" style="display: none;">
        <div class="container">
            <h2 class="admin-title">ADMIN PANEL</h2>
            
            <!-- News Management -->
            <div class="admin-panel" style="margin-bottom: 40px;">
                <h3 class="panel-subtitle">Manage News</h3>
                <form id="admin-news-form" class="admin-form">
                    <div class="form-group">
                        <label for="news-title">News Title</label>
                        <input type="text" id="news-title" name="title" placeholder="Enter headline..." required style="width: 100%; padding: 10px; margin-top: 5px; background: #0d0d0d; border: 1px solid #444; color: #e0e0e0; font-size: 1rem;">
                    </div>
                    <div class="form-group">
                        <label for="news-content">News Content</label>
                        <textarea id="news-content" name="content" rows="3" placeholder="Enter full article text..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="news-image-input">News Image (Optional)</label>
                        <input type="file" id="news-image-input" accept="image/*" style="width: 100%; margin-top: 5px;">
                    </div>
                    <button type="submit" class="btn btn-primary">Post News</button>
                </form>
                <div id="admin-news-list" class="admin-list" style="margin-top: 20px;">
                    <!-- News items will be loaded here -->
                </div>
            </div>

            <div class="admin-panel">
                <h3 class="panel-subtitle">Add New Prediction</h3>
                <form id="admin-prediction-form" class="admin-form">
                    <div class="form-group">
                        <label for="prediction-category">Category</label>
                        <select id="prediction-category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Forex">Forex</option>
                            <option value="Crypto">Crypto</option>
                            <option value="Stocks">Stocks</option>
                            <option value="ML Predictions">ML Predictions</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="prediction-asset">Asset</label>
                        <input type="text" id="prediction-asset" name="asset" placeholder="e.g., BTC/USD, EUR/USD" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="prediction-text">Prediction Text</label>
                        <textarea id="prediction-text" name="prediction_text" rows="5" placeholder="Enter your trading prediction..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="prediction-tier">Required Tier</label>
                        <select id="prediction-tier" name="required_tier" required>
                            <option value="">Select Tier</option>
                            <option value="Bronze">Bronze</option>
                            <option value="Silver">Silver</option>
                            <option value="Gold">Gold</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="prediction-image">Prediction Image (Optional)</label>
                        <input type="file" id="prediction-image" name="image" accept="image/*">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-large">Add Prediction</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Predictions Feed Section -->
    <section id="predictions-section" class="predictions-section">
        <div class="container">
            <h2 class="predictions-title">LATEST PREDICTIONS</h2>
            <div id="predictions-feed" class="predictions-feed">
                <!-- Predictions will be dynamically loaded here -->
            </div>
        </div>
    </section>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <button id="close-modal" class="modal-close">&times;</button>
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="register">Register</button>
            </div>
            <div id="auth-message" class="auth-message"></div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="tier-select">Select Tier</label>
                    <select id="tier-select" required>
                        <option value="Bronze" selected>Bronze</option>
                        <option value="Silver">Silver</option>
                        <option value="Gold">Gold</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
        </div>
    </div>

    <!-- Edit News Modal -->
    <div id="edit-news-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#1a1a1a; border:2px solid #333; padding:40px; width:90%; max-width:580px; position:relative; max-height:90vh; overflow-y:auto;">
            <button type="button" id="close-edit-news-modal" style="position:absolute; top:12px; right:18px; background:none; border:none; color:#e0e0e0; font-size:1.8rem; cursor:pointer; line-height:1;">&times;</button>
            <h2 style="color:#00ff88; font-size:1.6rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:28px;">Edit News</h2>

            <form id="edit-news-form">
                <input type="hidden" id="edit-news-id">

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">News Title</label>
                    <input type="text" id="edit-news-title" required style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none; box-sizing:border-box;">
                </div>

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">News Content</label>
                    <textarea id="edit-news-content" rows="4" required style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none; resize:vertical; box-sizing:border-box;"></textarea>
                </div>

                <div style="margin-bottom:28px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Image <span style="color:#666; font-size:0.8rem;">(optional — leave empty to keep current)</span></label>
                    <input type="file" id="edit-news-image" accept="image/*" style="width:100%; padding:10px; background:#0d0d0d; border:1px solid #444; color:#aaa; font-size:0.9rem; box-sizing:border-box; cursor:pointer;">
                    <div id="edit-news-current-image" style="margin-top:10px;"></div>
                </div>

                <button type="submit" style="width:100%; padding:14px; background:#00ff88; color:#050505; font-weight:800; font-size:1rem; text-transform:uppercase; letter-spacing:1px; border:none; cursor:pointer;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Edit Prediction Modal -->
    <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#1a1a1a; border:2px solid #333; padding:40px; width:90%; max-width:580px; position:relative; max-height:90vh; overflow-y:auto;">
            <button type="button" id="close-edit-modal" style="position:absolute; top:12px; right:18px; background:none; border:none; color:#e0e0e0; font-size:1.8rem; cursor:pointer; line-height:1;">&times;</button>
            <h2 style="color:#00ff88; font-size:1.6rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:28px;">Edit Prediction</h2>

            <form id="edit-prediction-form">
                <input type="hidden" id="edit-prediction-id">

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Category</label>
                    <select id="edit-category" required style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none;">
                        <option value="Forex">Forex</option>
                        <option value="Crypto">Crypto</option>
                        <option value="Stocks">Stocks</option>
                        <option value="ML Predictions">ML Predictions</option>
                    </select>
                </div>

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Asset</label>
                    <input type="text" id="edit-asset" required placeholder="e.g., BTC/USD" style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none; box-sizing:border-box;">
                </div>

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Prediction Text</label>
                    <textarea id="edit-text" rows="6" required style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none; resize:vertical; box-sizing:border-box;"></textarea>
                </div>

                <div style="margin-bottom:18px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Required Tier</label>
                    <select id="edit-tier" required style="width:100%; padding:12px; background:#0d0d0d; border:1px solid #444; color:#e0e0e0; font-size:1rem; border-radius:0; outline:none;">
                        <option value="Bronze">Bronze</option>
                        <option value="Silver">Silver</option>
                        <option value="Gold">Gold</option>
                    </select>
                </div>

                <div style="margin-bottom:28px;">
                    <label style="display:block; color:#aaa; font-size:0.85rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;">Image <span style="color:#666; font-size:0.8rem;">(optional — leave empty to keep current)</span></label>
                    <input type="file" id="edit-image" accept="image/*" style="width:100%; padding:10px; background:#0d0d0d; border:1px solid #444; color:#aaa; font-size:0.9rem; box-sizing:border-box; cursor:pointer;">
                    <div id="edit-current-image" style="margin-top:10px;"></div>
                </div>

                <button type="submit" style="width:100%; padding:14px; background:#00ff88; color:#050505; font-weight:800; font-size:1rem; text-transform:uppercase; letter-spacing:1px; border:none; cursor:pointer;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Prediction Details Section (populated dynamically by JS) -->
    <section id="prediction-details"></section>

    <!-- News Details Section (populated dynamically by JS) -->
    <section id="news-details"></section>

    </main>
    <!-- End Main Content -->

    <script type="module" src="auth.js"></script>
</body>
</html>
